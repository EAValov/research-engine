name: Publish Containers

on:
  release:
    types:
      - published

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-containers-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.image_title }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: research-api
            image_title: Research Engine API
            image_description: Research Engine backend API container
            context: ./ResearchEngine.API
            file: ./ResearchEngine.API/Containerfile
          - image_name: research-webui
            image_title: Research Engine Web UI
            image_description: Research Engine web UI container served by Caddy
            context: ./ResearchEngine.WebUI
            file: ./ResearchEngine.WebUI/Containerfile

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Prepare image metadata inputs
        id: prep
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          echo "owner_lc=${REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "source_url=${REPOSITORY_URL}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.prep.outputs.owner_lc }}/${{ matrix.image_name }}
          tags: |
            type=raw,value=${{ steps.prep.outputs.version }}
            type=raw,value=latest,enable=${{ github.event.release.prerelease == false }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image_title }}
            org.opencontainers.image.description=${{ matrix.image_description }}
            org.opencontainers.image.source=${{ steps.prep.outputs.source_url }}
            org.opencontainers.image.url=${{ steps.prep.outputs.source_url }}
            org.opencontainers.image.licenses=AGPL-3.0
            org.opencontainers.image.version=${{ steps.prep.outputs.version }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: |
            APP_VERSION=${{ steps.prep.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image_name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image_name }}

  compose-bundle:
    name: Publish Aspire Compose bundle
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Prepare bundle metadata
        id: prep
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          echo "owner_lc=${REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install Aspire CLI
        run: dotnet tool install -g aspire.cli --version 13.3.3

      - name: Publish Docker Compose bundle from Aspire
        run: >
          aspire publish
          --project ResearchEngine.AppHost/ResearchEngine.AppHost.csproj
          -o artifacts/research-engine-compose
          --
          --profile full
          --app-mode images
            --api-image ghcr.io/${{ steps.prep.outputs.owner_lc }}/research-api:${{ steps.prep.outputs.version }}
            --webui-image ghcr.io/${{ steps.prep.outputs.owner_lc }}/research-webui:${{ steps.prep.outputs.version }}
            --container-runtime docker
          --host-gateway host.docker.internal

      - name: Add compose bind-mount files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/research-engine-compose/crawl | Out-Null
          Copy-Item ResearchEngine.AppHost/Caddyfile artifacts/research-engine-compose/Caddyfile -Force
          Copy-Item ResearchEngine.AppHost/crawl/nuq-schema-fix.sql artifacts/research-engine-compose/crawl/nuq-schema-fix.sql -Force
          Copy-Item ResearchEngine.AppHost/crawl/searxng-settings.yml artifacts/research-engine-compose/crawl/searxng-settings.yml -Force

      - name: Archive Docker Compose bundle
        shell: pwsh
        run: Compress-Archive -Path artifacts/research-engine-compose/* -DestinationPath "research-engine-compose-${{ steps.prep.outputs.version }}.zip" -Force

      - name: Upload bundle to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" "research-engine-compose-${{ steps.prep.outputs.version }}.zip" --clobber
